<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Thor's Blocker</title>
  <style>
    body {
      margin: 0;
      padding: 16px 20px;
      width: 200px;
      font: 14px/1.4 system-ui, sans-serif;
      background: #1e1f24;
      color: #f2f2f2;
      text-align: center;
    }
    h1 { font-size: 15px; margin: 0 0 14px; }
    .switch { position: relative; display: inline-block; width: 56px; height: 30px; cursor: pointer; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #555; border-radius: 30px;
      transition: background .15s;
    }
    .slider::before {
      content: ""; position: absolute; left: 4px; top: 4px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #fff; transition: transform .15s;
    }
    input:checked + .slider { background: #3b82f6; }
    input:checked + .slider::before { transform: translateX(26px); }
    input:focus-visible + .slider { outline: 2px solid #93c5fd; outline-offset: 2px; }
    #status { margin: 12px 0 0; color: #b5b5b5; }
  </style>
</head>
<body>
  <h1>Thor's Blocker</h1>
  <label class="switch" title="Toggle blocking">
    <input type="checkbox" id="toggle" aria-label="Blocking">
    <span class="slider"></span>
  </label>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
